<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage Magique</title>
    <style>
        :root {
            --color-bg: #f8f4ff;
            --color-primary: #bce0fd;
            --color-secondary: #ffd1dc;
            --color-accent: #c4f2c5;
            --color-text: #6a6a8e;
            --color-dark: #4a4a68;
            --color-light: #ffffff;
            --border-radius: 15px;
            --shadow: 0 4px 8px rgba(106, 106, 142, 0.15);
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--color-primary);
            padding: 20px;
            text-align: center;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: var(--shadow);
        }

        h1 {
            color: var(--color-dark);
            margin: 0;
            font-size: 2.2rem;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            flex: 1;
        }

        .form-container {
            background-color: var(--color-light);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--color-dark);
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--color-primary);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--color-dark);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--color-secondary);
        }

        button {
            background-color: var(--color-accent);
            color: var(--color-dark);
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            width: 100%;
        }

        button:hover {
            background-color: #b0e6b1;
            transform: translateY(-2px);
        }

        .journey-container {
            background-color: var(--color-light);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: none;
        }

        .journey-info {
            margin-bottom: 20px;
            text-align: center;
        }

        .journey-info p {
            margin: 5px 0;
            font-size: 1.1rem;
        }

        .journey-tracker {
            position: relative;
            height: 20px;
            background-color: var(--color-primary);
            border-radius: 10px;
            margin: 30px 0;
            overflow: visible;
        }

        .journey-progress {
            position: absolute;
            height: 100%;
            background-color: var(--color-secondary);
            border-radius: 10px 0 0 10px;
            width: 0%;
            transition: width 1s ease;
        }

        .journey-points {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .vehicle {
            position: absolute;
            top: -20px;
            left: 0;
            transform: translateX(-50%);
            font-size: 30px;
            transition: left 1s ease;
        }

        .location-dot {
            width: 12px;
            height: 12px;
            background-color: var(--color-dark);
            border-radius: 50%;
            position: absolute;
            top: 4px;
            transform: translateX(-50%);
        }

        .location-dot.start {
            left: 0;
        }

        .location-dot.end {
            right: 0;
            left: auto;
            transform: translateX(50%);
        }

        .message {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 20px;
            color: var(--color-dark);
            font-weight: bold;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        footer {
            background-color: var(--color-primary);
            padding: 10px;
            text-align: center;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            margin-top: auto;
        }

        /* Animation pour les nuages */
        .clouds {
            position: absolute;
            width: 100%;
            height: 80px;
            top: 80px;
            z-index: -1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0.8;
        }

        .cloud:nth-child(1) {
            width: 100px;
            height: 60px;
            top: 20px;
            animation-duration: 120s;
            animation-delay: 0s;
        }

        .cloud:nth-child(2) {
            width: 80px;
            height: 50px;
            top: 10px;
            animation-duration: 90s;
            animation-delay: 15s;
        }

        .cloud:nth-child(3) {
            width: 120px;
            height: 70px;
            top: 30px;
            animation-duration: 150s;
            animation-delay: 30s;
        }

        @keyframes float {
            0% {
                left: -10%;
            }
            100% {
                left: 110%;
            }
        }

        /* Styles pour les différents véhicules */
        .vehicle-icon {
            font-size: 24px;
        }

        /* Pour les écrans mobiles */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
                margin: 10px;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <header>
        <h1>🚗 Mon Voyage Magique 🚂</h1>
    </header>

    <div class="container">
        <div class="form-container" id="formContainer">
            <h2>Où allons-nous aujourd'hui ?</h2>
            <div class="form-group">
                <label for="startPoint">Point de départ:</label>
                <input type="text" id="startPoint" placeholder="Par exemple: Paris, France">
            </div>
            <div class="form-group">
                <label for="endPoint">Point d'arrivée:</label>
                <input type="text" id="endPoint" placeholder="Par exemple: Marseille, France">
            </div>
            <div class="form-group">
                <label for="transportMode">Mode de transport:</label>
                <select id="transportMode">
                    <option value="car">Voiture 🚗</option>
                    <option value="train">Train 🚂</option>
                    <option value="bus">Bus 🚌</option>
                    <option value="bicycle">Vélo 🚲</option>
                    <option value="walk">À pied 🚶</option>
                </select>
            </div>
            <button id="startJourney">Démarrer le voyage</button>
            <p class="error-message" id="errorMessage"></p>
        </div>

        <div class="journey-container" id="journeyContainer">
            <div class="journey-info">
                <p><strong>De:</strong> <span id="journeyStart"></span></p>
                <p><strong>À:</strong> <span id="journeyEnd"></span></p>
                <p><strong>Transport:</strong> <span id="journeyMode"></span></p>
                <p><strong>Distance parcourue:</strong> <span id="journeyDistance"></span></p>
                <p><strong>Temps restant:</strong> <span id="journeyTime"></span></p>
            </div>

            <div class="journey-tracker">
                <div class="journey-progress" id="journeyProgress"></div>
                <div class="location-dot start"></div>
                <div class="location-dot end"></div>
                <div class="vehicle" id="vehicle">🚗</div>
            </div>

            <div class="journey-points">
                <div id="startPointLabel"></div>
                <div id="endPointLabel"></div>
            </div>

            <div class="message" id="journeyMessage">Bon voyage!</div>
            <button id="resetJourney">Nouveau voyage</button>
        </div>
    </div>

    <footer>
        <p>Un site amusant pour faire voyager les enfants! 🌈</p>
    </footer>

    <script>
        // Variables globales
        let map, directionsService, directionsRenderer;
        let currentPosition = null;
        let startCoords = null;
        let endCoords = null;
        let routeDistance = 0;
        let routeDuration = 0;
        let watchId = null;
        let updateIntervalId = null;

        // Éléments DOM
        const formContainer = document.getElementById('formContainer');
        const journeyContainer = document.getElementById('journeyContainer');
        const startPointInput = document.getElementById('startPoint');
        const endPointInput = document.getElementById('endPoint');
        const transportModeSelect = document.getElementById('transportMode');
        const startJourneyBtn = document.getElementById('startJourney');
        const resetJourneyBtn = document.getElementById('resetJourney');
        const errorMessage = document.getElementById('errorMessage');
        
        const journeyStart = document.getElementById('journeyStart');
        const journeyEnd = document.getElementById('journeyEnd');
        const journeyMode = document.getElementById('journeyMode');
        const journeyDistance = document.getElementById('journeyDistance');
        const journeyTime = document.getElementById('journeyTime');
        const journeyProgress = document.getElementById('journeyProgress');
        const vehicle = document.getElementById('vehicle');
        const startPointLabel = document.getElementById('startPointLabel');
        const endPointLabel = document.getElementById('endPointLabel');
        const journeyMessage = document.getElementById('journeyMessage');

        // Icônes des véhicules
        const vehicleIcons = {
            car: '🚗',
            train: '🚂',
            bus: '🚌',
            bicycle: '🚲',
            walk: '🚶'
        };

        // Messages d'encouragement
        const messages = [
            "Continue comme ça !",
            "Tu avances bien !",
            "Regarde comme on avance !",
            "Bientôt arrivé !",
            "La route est belle aujourd'hui !",
            "On voyage comme des champions !",
            "Que d'aventures en route !",
            "Le voyage se passe bien !",
            "Pas trop long le trajet ?",
            "On arrive bientôt !"
        ];

        // Fonction d'initialisation
        function init() {
            // Vérifier si la géolocalisation est disponible
            if (!navigator.geolocation) {
                showError("La géolocalisation n'est pas prise en charge par votre navigateur.");
                return;
            }

            // Initialiser les services Google Maps
            try {
                directionsService = new google.maps.DirectionsService();
                
                // Ajouter les événements
                startJourneyBtn.addEventListener('click', startJourney);
                resetJourneyBtn.addEventListener('click', resetJourney);
                transportModeSelect.addEventListener('change', updateVehicleIcon);
                
                // Définir l'icône du véhicule par défaut
                updateVehicleIcon();
            } catch (error) {
                loadGoogleMapsApi();
            }
        }

        // Fonction pour charger l'API Google Maps
        function loadGoogleMapsApi() {
            const script = document.createElement('script');
            script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyDc0DPa04gMIQIvNF2jcRkaPtfIenZehDc&libraries=places';
            script.defer = true;
            script.async = true;
            script.onload = init;
            script.onerror = () => showError("Impossible de charger Google Maps API. Veuillez réessayer plus tard.");
            document.head.appendChild(script);
        }

        // Fonction pour démarrer le voyage
        function startJourney() {
            const startPoint = startPointInput.value.trim();
            const endPoint = endPointInput.value.trim();
            const transportMode = transportModeSelect.value;

            if (!startPoint || !endPoint) {
                showError("Veuillez indiquer les points de départ et d'arrivée.");
                return;
            }

            errorMessage.style.display = 'none';
            
            // Convertir les adresses en coordonnées géographiques
            const geocoder = new google.maps.Geocoder();
            
            // Géocoder le point de départ
            geocoder.geocode({ address: startPoint }, (results, status) => {
                if (status !== 'OK' || !results[0]) {
                    showError("Impossible de trouver le point de départ.");
                    return;
                }
                
                startCoords = results[0].geometry.location;
                startPointLabel.textContent = results[0].formatted_address.split(',')[0];
                
                // Géocoder le point d'arrivée
                geocoder.geocode({ address: endPoint }, (results, status) => {
                    if (status !== 'OK' || !results[0]) {
                        showError("Impossible de trouver le point d'arrivée.");
                        return;
                    }
                    
                    endCoords = results[0].geometry.location;
                    endPointLabel.textContent = results[0].formatted_address.split(',')[0];
                    
                    // Calculer l'itinéraire
                    calculateRoute(transportMode);
                });
            });
        }

        // Fonction pour calculer l'itinéraire
        function calculateRoute(transportMode) {
            const request = {
                origin: startCoords,
                destination: endCoords,
                travelMode: getTravelMode(transportMode)
            };

            directionsService.route(request, (result, status) => {
                if (status !== 'OK') {
                    showError("Impossible de calculer l'itinéraire. Veuillez réessayer.");
                    return;
                }

                const route = result.routes[0];
                routeDistance = route.legs[0].distance.value; // en mètres
                routeDuration = route.legs[0].duration.value; // en secondes

                // Afficher les informations du voyage
                journeyStart.textContent = route.legs[0].start_address.split(',')[0];
                journeyEnd.textContent = route.legs[0].end_address.split(',')[0];
                journeyMode.textContent = getTransportModeName(transportMode);
                journeyDistance.textContent = route.legs[0].distance.text;
                journeyTime.textContent = route.legs[0].duration.text;

                // Afficher le conteneur du voyage
                formContainer.style.display = 'none';
                journeyContainer.style.display = 'block';

                // Démarrer la géolocalisation
                startTracking();
            });
        }

        // Fonction pour démarrer le suivi de position
        function startTracking() {
            // Obtenir la position actuelle
            navigator.geolocation.getCurrentPosition(
                position => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    
                    // Mettre à jour la progression
                    updateProgress();
                    
                    // Configurer l'intervalle de mise à jour (60 secondes)
                    updateIntervalId = setInterval(updateProgress, 60000); // 60000 ms = 60 secondes
                },
                error => {
                    showError("Erreur de géolocalisation: " + getGeolocationErrorMessage(error));
                },
                { enableHighAccuracy: true }
            );
        }

        // Fonction pour mettre à jour la progression
        function updateProgress() {
            navigator.geolocation.getCurrentPosition(
                position => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    
                    // Calculer la distance parcourue et restante
                    const distanceFromStart = calculateDistance(
                        startCoords.lat(), startCoords.lng(), 
                        currentPosition.lat, currentPosition.lng
                    );
                    
                    const distanceToEnd = calculateDistance(
                        currentPosition.lat, currentPosition.lng,
                        endCoords.lat(), endCoords.lng()
                    );
                    
                    const totalDistance = distanceFromStart + distanceToEnd;
                    const progressPercentage = (distanceFromStart / totalDistance) * 100;
                    
                    // Limiter la progression entre 0 et 100%
                    const clampedProgress = Math.max(0, Math.min(100, progressPercentage));
                    
                    // Mettre à jour la barre de progression
                    journeyProgress.style.width = clampedProgress + '%';
                    vehicle.style.left = clampedProgress + '%';
                    
                    // Mise à jour du temps restant
                    const remainingDistance = routeDistance - (routeDistance * (clampedProgress / 100));
                    const remainingTime = routeDuration * (remainingDistance / routeDistance);
                    journeyTime.textContent = formatTime(remainingTime);
                    
                    // Afficher un message d'encouragement aléatoire
                    if (Math.random() < 0.3) { // 30% de chance de changer le message
                        const randomIndex = Math.floor(Math.random() * messages.length);
                        journeyMessage.textContent = messages[randomIndex];
                    }
                    
                    // Vérifier si nous sommes arrivés
                    if (distanceToEnd < 500) { // Moins de 500 mètres de la destination
                        journeyMessage.textContent = "Nous sommes arrivés ! 🎉";
                        clearInterval(updateIntervalId);
                    }
                },
                error => {
                    console.error("Erreur lors de la mise à jour de la position: ", error);
                },
                { enableHighAccuracy: true }
            );
        }

        // Fonction pour réinitialiser le v
